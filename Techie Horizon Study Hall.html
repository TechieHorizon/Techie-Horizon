<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Techie Horizon Study Hall – Cabins</title>
<style>
:root{--bg:#f6f5f0;--card:#fff;--ink:#141414;--mute:#6b6b63;--line:#e3e1d6;--y:#ffc800;--yd:#b88f00;--free:#e7f6e9;--freeb:#9fd3a6;--occ:#141414;--occt:#ffc800;--warn:#d9480f;--ok:#1f8a3b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101010;--card:#1b1b1a;--ink:#f3f1e8;--mute:#a09e93;--line:#34332e;--free:#17301c;--freeb:#2f6a3a;--occ:#ffc800;--occt:#141414}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Barlow","Segoe UI",system-ui,sans-serif}
header{background:#141414;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{margin:0;font-size:20px;letter-spacing:.3px}
header small{color:#ffc800;display:block;font-size:13px}
.stats{margin-left:auto;display:flex;gap:18px;font-size:13px;color:#ccc}
.stats b{display:block;font-size:22px;color:#ffc800;line-height:1}
main{max-width:1100px;margin:0 auto;padding:16px}
nav{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
nav button{border:2px solid var(--ink);background:transparent;color:var(--ink);padding:8px 16px;font:inherit;font-weight:700;border-radius:8px;cursor:pointer}
nav button.on{background:var(--y);border-color:var(--y);color:#141414}
.btn{border:0;background:var(--y);color:#141414;font:inherit;font-weight:700;padding:9px 16px;border-radius:8px;cursor:pointer}
.btn.dark{background:#141414;color:#ffc800}.btn.wa{background:#25d366;color:#07310f}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.cab{border:2px solid var(--freeb);background:var(--free);border-radius:10px;padding:8px 6px;min-height:72px;text-align:center;cursor:pointer;font:inherit;color:var(--ink)}
.cab b{display:block;font-size:20px}.cab span{font-size:11px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cab.occ{background:var(--occ);border-color:var(--occ);color:var(--occt)}
.cab.due{outline:3px solid var(--warn);outline-offset:1px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--mute);margin:0 0 10px;flex-wrap:wrap}
.table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.table th,.table td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
.table th{background:var(--bg);font-size:13px;color:var(--mute)}
.scroll{overflow-x:auto}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;background:var(--line)}
.tag.over{background:var(--warn);color:#fff}.tag.soon{background:var(--y);color:#141414}.tag.okt{background:var(--ok);color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 12px;z-index:50}
.modal.show{display:flex}
.box{background:var(--card);border-radius:12px;padding:20px;width:100%;max-width:520px}
.box h2{margin:0 0 12px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 3px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:10px}.row>*{flex:1}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.inv{background:#fff;color:#141414;padding:22px;border-radius:8px;border:1px solid #ddd}
.inv .top{display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid #ffc800;padding-bottom:12px;margin-bottom:12px}
.inv table{width:100%;border-collapse:collapse;margin:10px 0}.inv td{padding:7px 0;border-bottom:1px solid #eee;font-size:14px}
.inv .tot td{font-weight:800;font-size:17px;border-bottom:0}
.note{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--y);padding:10px 14px;border-radius:8px;font-size:13px;color:var(--mute);margin-bottom:12px}
.empty{padding:24px;text-align:center;color:var(--mute)}
body.ro .wr{display:none!important}body:not(.in) main,body:not(.in) .stats{display:none}body.staff .adm{display:none!important}.lg{position:fixed;inset:0;background:#141414;display:flex;align-items:center;justify-content:center;z-index:99;padding:16px}.lg.hide{display:none}
.tag.new{background:#1f8a3b;color:#fff}.tag.ren{background:#3b5bdb;color:#fff}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}.kpi div{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--y);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--mute)}.kpi b{display:block;font-size:22px;color:var(--ink)}
@media print{body *{visibility:hidden}#invbox,#invbox *,#setbox,#setbox *{visibility:visible}.noprint{display:none!important}#setbox{position:absolute;left:0;top:0;width:100%}#invbox{position:absolute;left:0;top:0;width:100%}.modal{background:none;padding:0}.box{box-shadow:none;max-width:none}}
</style>
</head>
<body>
<header>
<svg width="46" height="46" viewBox="0 0 100 100" aria-label="TH logo"><circle cx="50" cy="50" r="48" fill="#fff"/><circle cx="50" cy="50" r="42" fill="#ffc800"/><circle cx="46" cy="50" r="36" fill="#141414"/><text x="46" y="64" font-family="Arial Black,Arial" font-weight="900" font-size="40" text-anchor="middle" fill="#fff">T<tspan fill="#ffc800">H</tspan></text></svg>
<div><h1>Techie Horizon Study Hall</h1><small>Cabin &amp; fee manager · <span id="syncst">Saved on this device only</span></small></div>
<div class="stats"><div><b id="sFree">0</b>free</div><div><b id="sOcc">0</b>occupied</div><div><b id="sDue">0</b>need reminder</div></div>
<div style="text-align:right;font-size:12px;color:#ccc"><span id="who"></span><br><button class="btn sm" onclick="logout()">Log out</button></div></header>
<main>
<nav>
<button id="t-sum" class="on" onclick="tab('sum')">Summary</button>
<button id="t-cabins" onclick="tab('cabins')">Cabins</button>
<button id="t-students" onclick="tab('students')">Students</button>
<button id="t-remind" onclick="tab('remind')">Reminders</button>
<button id="t-settle" class="adm" onclick="tab('settle')">Monthly settlement</button>
<button id="t-set" class="wr adm" onclick="tab('set')">Settings</button>
<button class="btn dark wr" style="margin-left:auto" onclick="openAdmit()">+ New admission</button>
</nav>
<section id="v"></section>
</main>

<div class="lg" id="lg"><div class="box" id="lgb" style="max-width:380px">Loading…</div></div>
<div class="modal" id="m1"><div class="box" id="m1b"></div></div>
<div class="modal" id="m2"><div class="box"><div id="invbox"></div><div class="acts"><button class="btn wa" id="waBtn">Send PDF on WhatsApp</button><button class="btn dark" onclick="window.print()">Print / Save PDF</button><button class="btn ghost" onclick="closeM('m2')">Close</button></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const KEY="th-cabins-v1";
let S={s:[],inv:[],exp:[],n:1,cfg:{hall:"Techie Horizon Study Hall",fee:1500,upi:"",phone:"",addr:"",cabins:82,lead:3}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
let cur="sum";
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}sync()};
const today=()=>new Date(new Date().toDateString());
const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const fmt=d=>new Date(d).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});
const addM=(d,m)=>{const x=new Date(d);const day=x.getDate();x.setMonth(x.getMonth()+m);if(x.getDate()!==day)x.setDate(0);return iso(x)};
const daysLeft=s=>Math.round((new Date(s.due)-today())/864e5);
const inr=n=>"₹"+Number(n).toLocaleString("en-IN");
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const active=()=>S.s.filter(x=>x.active);
const byCab=n=>active().find(x=>x.cabin===n);
const needs=()=>active().filter(x=>daysLeft(x)<=S.cfg.lead);
function phone(p){let d=String(p).replace(/\D/g,"");if(d.length===10)d="91"+d;return d}
function wa(p,t){const a=document.createElement('a');a.href=(/Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent)?'https://wa.me/'+phone(p)+'?text=':'https://web.whatsapp.com/send?phone='+phone(p)+'&text=')+encodeURIComponent(t);a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}

let setOK=false;
function tab(t){if(t==='set'&&!setOK){askSet();return}if(t!=='set')setOK=false;cur=t;["sum","cabins","students","remind","settle","set"].forEach(k=>$("t-"+k).classList.toggle("on",k===t));render()}
function render(){
 const a=active();$("sOcc").textContent=a.length;$("sFree").textContent=S.cfg.cabins-a.length;$("sDue").textContent=needs().length;
 let h="";
 if(cur==="cabins"){
  h+='<p class="legend"><span>Green = free, tap to admit a student</span><span>Black = occupied</span><span>Red outline = fee due soon or overdue</span></p><div class="grid">';
  for(let i=1;i<=S.cfg.cabins;i++){const s=byCab(i);
   h+=s?`<button class="cab occ ${daysLeft(s)<=S.cfg.lead?"due":""}" onclick="openStudent(${s.id})"><b>${i}</b><span>${esc(s.name)}</span></button>`:`<button class="cab" onclick="openAdmit(${i})"><b>${i}</b><span>Free</span></button>`}
  h+="</div>";
 }
 if(cur==="students"){
  h+=a.length?'<div class="scroll"><table class="table"><tr><th>Cabin</th><th>Name</th><th>Phone</th><th>Paid until</th><th>Status</th><th></th></tr>'+a.sort((x,y)=>x.cabin-y.cabin).map(s=>`<tr><td><b>${s.cabin}</b></td><td>${esc(s.name)}</td><td>${esc(s.phone)}</td><td>${fmt(s.due)}</td><td>${badge(s)}</td><td><button class="btn sm" onclick="openStudent(${s.id})">Open</button></td></tr>`).join("")+"</table></div>":'<div class="empty">No students yet. Tap “New admission” to add the first one.</div>';
 }
 if(cur==="remind"){
  const n=needs().sort((x,y)=>daysLeft(x)-daysLeft(y));
  h+=`<div class="note">Shows students whose fee ends within ${S.cfg.lead} days or is already overdue. Each button opens WhatsApp with the message ready; press send there. WhatsApp does not allow a web page to send messages by itself.</div>`;
  h+=n.length?'<div class="scroll"><table class="table"><tr><th>Cabin</th><th>Name</th><th>Due</th><th>Status</th><th></th></tr>'+n.map(s=>`<tr><td><b>${s.cabin}</b></td><td>${esc(s.name)}</td><td>${fmt(s.due)}</td><td>${badge(s)}</td><td><button class="btn wa sm" onclick="remind(${s.id})">Remind</button> <button class="btn sm wr" onclick="renewForm(${s.id})">Renew</button></td></tr>`).join("")+"</table></div>":'<div class="empty">Nobody needs a reminder right now.</div>';
 }
 if(cur==="students")h+=vacatedHTML();
 if(cur==="sum")h+=summaryHTML();
 if(cur==="settle")h+=settleHTML();
 if(cur==="set"){
  const c=S.cfg;
  h+=`<div class="box" style="max-width:520px"><h2>Settings</h2><label>Study hall name</label><input id="c1" value="${esc(c.hall)}"><label>Address</label><input id="c2" value="${esc(c.addr)}"><label>Hall contact number</label><input id="c3" value="${esc(c.phone)}"><label>UPI ID for payments</label><input id="c4" value="${esc(c.upi)}" placeholder="name@upi"><div class="row"><div><label>Default monthly fee (₹)</label><input id="c5" type="number" value="${c.fee}"></div><div><label>Total cabins</label><input id="c6" type="number" value="${c.cabins}"></div><div><label>Remind days before</label><input id="c7" type="number" value="${c.lead}"></div></div><div class="acts"><button class="btn" onclick="saveCfg()">Save settings</button></div></div>`;
 }
 if(cur==="set")h+=usersHTML();
 $("v").innerHTML=h;
}
function badge(s){const d=daysLeft(s);return d<0?`<span class="tag over">Overdue ${-d}d</span>`:d<=S.cfg.lead?`<span class="tag soon">Due in ${d}d</span>`:`<span class="tag okt">Paid</span>`}
function saveCfg(){if(RO)return;const c=S.cfg;c.hall=$("c1").value||c.hall;c.addr=$("c2").value;c.phone=$("c3").value;c.upi=$("c4").value;c.fee=+$("c5").value||c.fee;c.cabins=+$("c6").value||c.cabins;c.lead=+$("c7").value||0;save();render();alert("Settings saved")}
function openM(id,h){if(h)$(id+"b").innerHTML=h;$(id).classList.add("show")}
function closeM(id){$(id).classList.remove("show")}

function firstFree(){for(let i=1;i<=S.cfg.cabins;i++)if(!byCab(i))return i;return ""}
function openAdmit(cab){
 if(RO)return;
 const c=cab||firstFree();
 if(!c&&!cab){alert("All cabins are full.");return}
 openM("m1",`<h2>New admission</h2><label>Student name</label><input id="a1"><label>WhatsApp number</label><input id="a2" type="tel" placeholder="10-digit number"><div class="row"><div><label>Cabin (auto-assigned)</label><input id="a3" type="number" value="${c}" min="1" max="${S.cfg.cabins}"></div><div><label>Joining date</label><input id="a4" type="date" value="${iso(today())}"></div></div><div class="row"><div><label>Months paid</label><input id="a5" type="number" value="1" min="1"></div><div class="adm"><label>Monthly fee (₹)</label><input id="a6" type="number" value="${S.cfg.fee}"></div></div><div class="row"><div class="adm"><label>Admission / deposit (₹)</label><input id="a7" type="number" value="0"></div><div><label>Payment mode</label><select id="a8"><option>UPI</option><option>Cash</option><option>Card</option><option>Bank transfer</option></select></div></div><div class="acts"><button class="btn" onclick="admit()">Assign cabin and create invoice</button><button class="btn ghost" onclick="closeM('m1')">Cancel</button></div>`);
}
function admit(){
 const name=$("a1").value.trim(),ph=$("a2").value.trim(),cab=+$("a3").value;
 if(!name||phone(ph).length<11){alert("Enter the student’s name and a valid WhatsApp number.");return}
 if(!cab||cab>S.cfg.cabins||byCab(cab)){alert("Cabin "+cab+" is not available. Pick a free cabin.");return}
 const id=Date.now(),st=$("a4").value,m=+$("a5").value||1;
 const s={id,name,phone:ph,cabin:cab,start:st,fee:+$("a6").value,due:addM(st,m),active:true};
 S.s.push(s);
 const no=mkInv(s,st,m,+$("a7").value||0,$("a8").value,"Cabin rent");
 save();closeM("m1");render();showInv(no);
}
function mkInv(s,from,m,dep,mode,desc){
 const no="THSH-"+String(S.n++).padStart(4,"0");
 S.inv.push({no,sid:s.id,date:iso(today()),from,to:addM(from,m),months:m,fee:s.fee,dep,mode,desc,name:s.name,phone:s.phone,cabin:s.cabin});
 return no;
}
function showInv(no){
 const v=S.inv.find(x=>x.no===no),c=S.cfg,tot=v.fee*v.months+v.dep;
 $("invbox").innerHTML=`<div class="inv"><div class="top"><div><b style="font-size:19px">${esc(c.hall)}</b><br><small>${esc(c.addr)} ${c.phone?"· "+esc(c.phone):""}</small></div><svg width="54" height="54" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#fff"/><circle cx="50" cy="50" r="42" fill="#ffc800"/><circle cx="46" cy="50" r="36" fill="#141414"/><text x="46" y="64" font-family="Arial Black,Arial" font-weight="900" font-size="40" text-anchor="middle" fill="#fff">T<tspan fill="#ffc800">H</tspan></text></svg></div><div style="display:flex;justify-content:space-between"><div><b>INVOICE ${v.no}</b><br>Date: ${fmt(v.date)}</div><div style="text-align:right">Billed to<br><b>${esc(v.name)}</b><br>${esc(v.phone)}</div></div><table><tr><td>${esc(v.desc)} – Cabin ${v.cabin}<br><small>${fmt(v.from)} to ${fmt(v.to)}</small></td><td style="text-align:right">${v.months} × ${inr(v.fee)}</td><td style="text-align:right">${inr(v.fee*v.months)}</td></tr>${v.dep?`<tr><td colspan="2">Admission / deposit</td><td style="text-align:right">${inr(v.dep)}</td></tr>`:""}<tr class="tot"><td colspan="2">Total paid (${esc(v.mode)})</td><td style="text-align:right">${inr(tot)}</td></tr></table><small>Next fee due on ${fmt(v.to)}. ${c.upi?"Pay via UPI: "+esc(c.upi)+".":""} Thank you!</small></div>`;
 $("waBtn").onclick=()=>sendInvPdf(v,`Hello ${v.name},\nThank you for joining ${c.hall}.\n\nInvoice: ${v.no}\nCabin: ${v.cabin}\nPeriod: ${fmt(v.from)} to ${fmt(v.to)}\nAmount paid: ${inr(tot)} (${v.mode})\nNext fee due: ${fmt(v.to)}\n${c.upi?"UPI: "+c.upi+"\n":""}\nAll the best with your studies!`);
 if(ME&&ME.role==='staff'){$("waBtn").onclick();return}
 openM("m2");
}
function openStudent(id){
 const s=S.s.find(x=>x.id===id),invs=S.inv.filter(x=>x.sid===id).reverse();
 openM("m1",`<h2>Cabin ${s.cabin} – ${esc(s.name)}</h2><p>${esc(s.phone)}<br>Paid until <b>${fmt(s.due)}</b> ${badge(s)}</p><b>Invoices</b>${invs.map(v=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>${v.no} · ${fmt(v.date)}</span><button class="btn sm adm" onclick="closeM('m1');showInv('${v.no}')">View</button></div>`).join("")}<div class="acts"><button class="btn ghost wr" onclick="editForm(${id})">Edit / change cabin</button><button class="btn wr" onclick="renewForm(${id})">Renew fee</button><button class="btn wa" onclick="remind(${id})">Send reminder</button><button class="btn ghost wr" onclick="vacate(${id})">Vacate cabin</button><button class="btn ghost wr adm" onclick="delStudent(${id})">Delete record</button><button class="btn ghost" onclick="closeM('m1')">Close</button></div>`);
}
function renewForm(id){
 const s=S.s.find(x=>x.id===id);
 openM("m1",`<h2>Renew – ${esc(s.name)}</h2><p>Cabin ${s.cabin}. Current period ends ${fmt(s.due)}.</p><div class="row"><div><label>Months</label><input id="r1" type="number" value="1" min="1"></div><div class="adm"><label>Monthly fee (₹)</label><input id="r2" type="number" value="${s.fee}"></div></div><label>Payment mode</label><select id="r3"><option>UPI</option><option>Cash</option><option>Card</option><option>Bank transfer</option></select><div class="acts"><button class="btn" onclick="renew(${id})">Create renewal invoice</button><button class="btn ghost" onclick="closeM('m1')">Cancel</button></div>`);
}
function renew(id){
 const s=S.s.find(x=>x.id===id),m=+$("r1").value||1;s.fee=+$("r2").value||s.fee;
 const from=daysLeft(s)<0?iso(today()):s.due;
 const no=mkInv(s,from,m,0,$("r3").value,"Cabin rent renewal");
 s.due=addM(from,m);save();closeM("m1");render();showInv(no);
}
function vacate(id){
 const s=S.s.find(x=>x.id===id);
 if(confirm("Free cabin "+s.cabin+" and remove "+s.name+" from active students? Their invoices and collected amount stay in the records (use Delete record to erase a mistaken entry).")){if(ME&&ME.role==='admin'&&confirm('Was this entry added by mistake? Press OK to ERASE all invoices and amounts of this student, so they no longer count in new joinings or collections. Press Cancel to keep the payment records.')){S.s=S.s.filter(x=>x.id!==id);S.inv=S.inv.filter(v=>v.sid!==id)}else s.active=false;save();closeM("m1");render()}
}
function remind(id){
 const s=S.s.find(x=>x.id===id),d=daysLeft(s),c=S.cfg;
 const when=d<0?`was due on ${fmt(s.due)} (${-d} days ago)`:d===0?"is due today":`is due on ${fmt(s.due)} (in ${d} days)`;
 wa(s.phone,`Hello ${s.name},\nThis is a friendly reminder from ${c.hall}. Your fee for Cabin ${s.cabin} ${when}.\nAmount: ${inr(s.fee)}\n${c.upi?"Pay via UPI: "+c.upi+"\n":""}Please ignore if already paid. Thank you!`);
}
let sm=iso(today()).slice(0,7);
async function changeSetPw(){const p=$('sp2').value;if(p.length<6){alert('Use 6 or more characters.');return}const s=salt();SETPW={salt:s,h:await hx(s,p)};saveUsers();$('sp2').value='';alert('Settings password changed.')}
const rs=n=>Number(n).toLocaleString('en-IN');
function invPdf(v){
 const d=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),c=S.cfg,tot=v.fee*v.months+v.dep;
 d.setFillColor(255,200,0);d.rect(0,0,210,6,'F');
 d.setFont('helvetica','bold');d.setFontSize(18);d.text(c.hall,15,22);
 d.setFont('helvetica','normal');d.setFontSize(10);d.text([c.addr||'',c.phone?'Phone: '+c.phone:''].filter(Boolean),15,28);
 d.setFont('helvetica','bold');d.setFontSize(14);d.text('INVOICE '+v.no,15,46);
 d.setFont('helvetica','normal');d.setFontSize(10);d.text('Date: '+fmt(v.date),15,53);
 d.text(['Billed to:',v.name,v.phone],140,46);

let DB=null,RO=false,started=0;const last={students:{},invoices:{},expenses:{},cfg:''},first={};

function setRO(){RO=true;document.body.classList.add('ro');$('syncst').textContent='Live · view only';render()}
function warn(e){console.error(e);if(e&&e.code==='invalid_argument'&&!RO)setRO()}
function sync(){
 if(!DB||RO)return;
 COLS.forEach(([col,k,key])=>{
  const seen={};
  (S[k]||[]).forEach(it=>{const id=key(it),str=JSON.stringify(it);seen[id]=1;
   if(last[col][id]!==str){last[col][id]=str;DB.doc(col+'/'+id).set(it).catch(e=>{last[col][id]=null;warn(e)})}});
  Object.keys(last[col]).forEach(id=>{if(!seen[id]){delete last[col][id];DB.doc(col+'/'+id).delete().catch(warn)}});
 });
 const c=JSON.stringify({cfg:S.cfg,n:S.n,resetAt:S.resetAt||0});
 if(last.cfg!==c){last.cfg=c;DB.doc('app/cfg').set({cfg:S.cfg,n:S.n,resetAt:S.resetAt||0}).catch(warn)}
}
function listen(col,k,key){
 DB.collection(col).onSnapshot(snap=>{
  if(snap.metadata.fromCache)return;
  const arr=snap.docs.map(d=>JSON.parse(JSON.stringify(d.data())));
  if(!first[col]){first[col]=1;if(!arr.length&&(S[k]||[]).length){sync();return}}
  arr.sort((a,b)=>col==='invoices'?(a.no<b.no?-1:1):a.id-b.id);
  S[k]=arr;last[col]={};arr.forEach(it=>last[col][key(it)]=JSON.stringify(it));
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  render();
 },e=>console.error(e));
}

  if(user&&(await user.can('data.write'))===false)setRO();
  $('syncst').textContent=RO?'Live · view only':'Live · synced';
  DB.doc('app/users').onSnapshot(d=>{if(d.metadata.fromCache)return;if(d.exists){const v=JSON.parse(JSON.stringify(d.data()));USERS=v.list||[];SETPW=v.setpw||null;try{localStorage.setItem('th-users',JSON.stringify(USERS));localStorage.setItem('th-setpw',JSON.stringify(SETPW))}catch(e){}}else if(USERS.length&&!RO)saveUsers();gate()},e=>{console.error(e);gate()});
  DB.doc('app/cfg').onSnapshot(d=>{
   if(d.metadata.fromCache)return;
   if(d.exists){const v=JSON.parse(JSON.stringify(d.data()));
    if(v.resetAt&&v.resetAt>(S.resetAt||0)){S.s=[];S.inv=[];S.exp=[];last.students={};last.invoices={};last.expenses={}}
    S.cfg=Object.assign(S.cfg,v.cfg||{});if(v.n)S.n=v.n;S.resetAt=Math.max(S.resetAt||0,v.resetAt||0);
    last.cfg=JSON.stringify({cfg:S.cfg,n:S.n,resetAt:S.resetAt});
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render()}
   else sync();
   if(!started){started=1;COLS.forEach(([col,k,key])=>listen(col,k,key))}
  },e=>console.error(e));
 }catch(e){console.error(e);gate()}
})();
render();
</script>
</body>
</html>
