<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Study Hall Register</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --paper:#E7E9EC;
    --paper-line:#D4D7DC;
    --navy:#1B2A4A;
    --navy-light:#2C4066;
    --ochre:#C08829;
    --ochre-light:#E8C387;
    --green:#2F7D4F;
    --green-bg:#E4F0E7;
    --red:#B23A34;
    --red-bg:#F6E5E3;
    --amber:#B8791A;
    --amber-bg:#F5E9D2;
    --ink:#1B2A4A;
    --ink-soft:#5C6470;
    --radius:10px;
    --shadow-sm:0 1px 2px rgba(27,42,74,0.06), 0 1px 1px rgba(27,42,74,0.04);
    --shadow-md:0 4px 16px rgba(27,42,74,0.10), 0 2px 6px rgba(27,42,74,0.06);
    --shadow-lift:0 10px 24px rgba(27,42,74,0.16), 0 4px 10px rgba(27,42,74,0.08);
    --font-display:'Playfair Display',Georgia,'Times New Roman',serif;
    --font-mono:'Courier New',Courier,monospace;
    --font-body:'Inter',-apple-system,'Segoe UI',Arial,sans-serif;
  }
  *{box-sizing:border-box;}

  /* ===== Entrance animations ===== */
  @keyframes fadeInUp{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
  }
  @keyframes modalPop{
    from{opacity:0; transform:scale(0.94) translateY(8px);}
    to{opacity:1; transform:scale(1) translateY(0);}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001s !important; animation-delay:0s !important; transition-duration:0.001s !important;}
  }
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(ellipse at top, rgba(255,255,255,0.65), transparent 60%),
      linear-gradient(125deg, transparent 0%, rgba(120,130,145,0.05) 22%, transparent 30%, transparent 55%, rgba(120,130,145,0.06) 62%, transparent 72%),
      linear-gradient(35deg, transparent 40%, rgba(255,255,255,0.4) 46%, transparent 52%);
    background-attachment:fixed;
    font-family:var(--font-body);
    color:var(--ink);
    padding:0 0 60px 0;
  }
  .wrap{max-width:920px;margin:0 auto;padding:0 20px;}

  /* ===== Header ===== */
  header{
    background:linear-gradient(135deg,#16233F 0%,var(--navy) 55%,var(--navy-light) 100%);
    color:#F3EFE2;
    padding:28px 0 24px 0;
    border-bottom:6px double var(--ochre);
    margin-bottom:26px;
    box-shadow:var(--shadow-md);
    position:relative;
    animation:fadeInUp .5s ease both;
  }
  header .inner{max-width:920px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:14px;}
  .seal{
    width:54px;height:54px;border-radius:50%;
    border:2px solid var(--ochre-light);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;overflow:hidden;background:#fff;
    box-shadow:0 0 0 4px rgba(232,195,135,0.15), var(--shadow-sm);
  }
  .seal img{width:100%;height:100%;object-fit:cover;}
  header h1{font-family:var(--font-display);font-size:27px;font-weight:700;margin:0;letter-spacing:0.4px;text-shadow:0 1px 3px rgba(0,0,0,0.25);}
  header .sub{font-size:12.5px;color:#C7CBD8;margin-top:3px;letter-spacing:1px;text-transform:uppercase;}
  header .today{font-family:var(--font-mono);font-size:13px;color:#C7CBD8;text-align:right;}
  header .today b{color:#F3EFE2;font-size:15px;display:block;}

  /* ===== Stats ===== */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px;}
  .stat{
    background:#fff;border:1px solid var(--paper-line);border-left:4px solid var(--ochre);
    padding:14px 16px;border-radius:var(--radius);box-shadow:var(--shadow-sm);
    transition:transform .18s ease, box-shadow .18s ease;
    animation:fadeInUp .5s ease both;
  }
  .stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
  .stat:nth-child(1){animation-delay:.05s;}
  .stat:nth-child(2){animation-delay:.12s;}
  .stat:nth-child(3){animation-delay:.19s;}
  .stat:nth-child(4){animation-delay:.26s;}
  .stat .n{font-family:var(--font-display);font-size:26px;font-weight:bold;color:var(--navy);}
  .stat .l{font-size:11px;text-transform:uppercase;letter-spacing:0.8px;color:var(--ink-soft);margin-top:2px;}

  /* ===== Section titles ===== */
  .section-title{
    font-family:var(--font-display);font-size:15px;text-transform:uppercase;letter-spacing:1.5px;
    color:var(--navy);border-bottom:2px solid var(--navy);padding-bottom:6px;margin:30px 0 14px 0;
    display:flex;align-items:center;justify-content:space-between;
    animation:fadeIn .6s ease both;
  }

  /* ===== Reminders ===== */
  #reminders{display:flex;flex-direction:column;gap:10px;}
  .reminder-empty{color:var(--ink-soft);font-size:13.5px;font-style:italic;padding:10px 0;}
  .reminder-card{
    background:var(--red-bg);border:1px solid #E0BEBA;padding:12px 14px;border-radius:8px;box-shadow:var(--shadow-sm);
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  }
  .reminder-card.amber{background:var(--amber-bg);border-color:#E4CFA0;}
  .reminder-info b{font-family:var(--font-display);}
  .reminder-info .days{font-family:var(--font-mono);font-size:12px;color:var(--red);}
  .reminder-card.amber .days{color:var(--amber);}
  .wa-btn{
    background:linear-gradient(135deg,#2F7D4F,#256640);color:#fff;border:none;padding:8px 14px;font-size:12.5px;font-weight:bold;
    cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;border-radius:6px;
    box-shadow:var(--shadow-sm);transition:transform .15s ease;
  }
  .wa-btn:hover{background:linear-gradient(135deg,#256640,#1e5233);transform:translateY(-1px);}

  /* ===== Form ===== */
  .form-box{background:#fff;border:1px solid var(--paper-line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:18px 20px;margin-bottom:8px;}
  .form-grid{display:grid;grid-template-columns:1.6fr 1.2fr 1.1fr 0.8fr 1.1fr 1fr auto;gap:10px;align-items:end;}
  .field label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:0.6px;color:var(--ink-soft);margin-bottom:4px;}
  .field input,.field select{
    width:100%;padding:8px 9px;border:1px solid #C9C4B0;background:#FCFBF6;
    font-family:var(--font-mono);font-size:13.5px;color:var(--ink);
  }
  .field input:focus,.field select:focus{outline:2px solid var(--ochre);outline-offset:1px;}
  .add-btn{
    background:linear-gradient(135deg,var(--navy),var(--navy-light));color:#F3EFE2;border:none;padding:10px 20px;font-size:13px;font-weight:bold;
    cursor:pointer;letter-spacing:0.5px;white-space:nowrap;border-radius:7px;box-shadow:var(--shadow-sm);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .add-btn:hover{background:linear-gradient(135deg,var(--navy-light),var(--navy));box-shadow:var(--shadow-md);transform:translateY(-1px);}
  .form-err{color:var(--red);font-size:12px;margin-top:8px;}

  /* ===== Search ===== */
  .search-row{margin:16px 0;}
  .search-row input{
    width:100%;padding:9px 12px;border:1px solid #C9C4B0;background:#fff;
    font-size:13.5px;font-family:var(--font-body);
  }

  /* ===== Student stub (hall-ticket style) ===== */
  .stub{
    background:#fff;border:1px solid var(--paper-line);border-radius:var(--radius);overflow:hidden;
    margin-bottom:12px;position:relative;box-shadow:var(--shadow-sm);
    transition:box-shadow .18s ease, transform .18s ease;
    display:grid;grid-template-columns:70px 1fr auto;gap:0;
    animation:fadeInUp .4s ease both;
  }
  .stub:hover{box-shadow:var(--shadow-md);transform:translateY(-3px);}
  .stub::before{
    content:"";position:absolute;left:70px;top:0;bottom:0;width:0;
    border-left:2px dashed #C9C4B0;
  }
  .stub-roll{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:10px 4px;background:var(--navy);color:#F3EFE2;
  }
  .stub-roll .lbl{font-size:8.5px;text-transform:uppercase;letter-spacing:0.5px;color:#9AA3BB;}
  .stub-roll .num{font-family:var(--font-mono);font-size:15px;font-weight:bold;}
  .stub-main{padding:12px 16px;}
  .stub-main .name{font-family:var(--font-display);font-size:17px;font-weight:bold;color:var(--navy);}
  .stub-meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:5px;font-size:12px;color:var(--ink-soft);font-family:var(--font-mono);}
  .stub-actions{padding:12px 16px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;justify-content:center;}
  .stamp{
    font-family:var(--font-display);font-weight:bold;font-size:11.5px;letter-spacing:1px;
    border:2px solid; padding:3px 10px;border-radius:4px;transform:rotate(-4deg);
    text-transform:uppercase;
  }
  .stamp.paid{color:var(--green);border-color:var(--green);}
  .stamp.due{color:var(--amber);border-color:var(--amber);}
  .stamp.overdue{color:var(--red);border-color:var(--red);}
  .btn-row{display:flex;gap:6px;}
  .mini-btn{
    background:var(--paper);border:1px solid #C9C4B0;color:var(--ink);padding:6px 10px;font-size:11.5px;
    cursor:pointer;text-decoration:none;border-radius:6px;transition:background .15s ease, transform .15s ease;
  }
  .mini-btn:hover{background:#E4E0CE;transform:translateY(-1px);}
  .mini-btn.danger{color:var(--red);}
  .mini-btn.wa{background:var(--green);color:#fff;border-color:var(--green);}
  .mini-btn.wa:hover{background:#256640;}
  .mini-btn:disabled{opacity:0.5;cursor:not-allowed;background:var(--paper);}
  .mini-btn:disabled:hover{background:var(--paper);}

  /* ===== Modal (replaces native confirm/prompt, which browsers block in embedded frames) ===== */
  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(15,22,42,0.6);backdrop-filter:blur(3px);
    align-items:center;justify-content:center;z-index:1000;padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    background:#FCFBF6;border:1px solid var(--paper-line);border-top:4px solid var(--ochre);
    border-radius:10px;
    max-width:420px;width:100%;padding:22px 24px;box-shadow:var(--shadow-lift);
    max-height:80vh;overflow-y:auto;
    animation:modalPop .22s ease;
  }
  .modal-box h3{font-family:var(--font-display);font-size:17px;margin:0 0 10px 0;color:var(--navy);}
  .modal-box p{font-size:13.5px;color:var(--ink-soft);margin:0 0 16px 0;line-height:1.5;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;}
  .modal-list{list-style:none;margin:0 0 16px 0;padding:0;display:flex;flex-direction:column;gap:6px;}
  .modal-list li button{
    width:100%;text-align:left;background:#fff;border:1px solid #C9C4B0;padding:9px 12px;font-size:13px;
    cursor:pointer;font-family:var(--font-body);color:var(--ink);
  }
  .modal-list li button:hover{background:var(--paper);border-color:var(--ochre);}

  .history{padding:0 16px 14px 90px;font-size:12px;color:var(--ink-soft);border-top:1px dashed #E1DCC7;margin-top:0;}
  .history table{width:100%;border-collapse:collapse;margin-top:8px;font-family:var(--font-mono);}
  .history td{padding:3px 6px 3px 0;}

  .empty-state{padding:40px 10px;text-align:center;color:var(--ink-soft);font-style:italic;}

  /* ===== Monthly collections ===== */
  .month-table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border:1px solid var(--paper-line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);margin-bottom:8px;}
  .month-table th{
    text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:0.6px;color:var(--ink-soft);
    padding:9px 14px;border-bottom:1px solid var(--paper-line);background:#F7F6F0;
  }
  .month-table td{padding:9px 14px;border-bottom:1px solid var(--paper-line);font-size:13.5px;}
  .month-table tr:last-child td{border-bottom:none;}
  .month-table td.mname{font-family:var(--font-display);font-weight:bold;color:var(--navy);}
  .month-table td.mtotal{font-family:var(--font-mono);font-weight:bold;color:var(--green);}
  .month-table td.mcount{font-family:var(--font-mono);color:var(--ink-soft);}
  .month-table tr.current-month td.mname::after{
    content:"current";font-family:var(--font-body);font-weight:normal;font-size:9.5px;text-transform:uppercase;
    letter-spacing:0.5px;color:var(--ochre);border:1px solid var(--ochre);padding:1px 6px;margin-left:8px;
  }
  .month-split{font-size:11px;color:var(--ink-soft);font-family:var(--font-mono);}

  /* ===== Header icon buttons ===== */
  .icon-btn{
    background:transparent;border:1px solid #4A5B82;color:#D9DCE6;padding:7px 12px;font-size:12px;
    cursor:pointer;letter-spacing:0.5px;display:inline-flex;align-items:center;gap:6px;border-radius:6px;
    transition:background .15s ease, transform .15s ease;
  }
  .icon-btn:hover{background:#28395E;border-color:var(--ochre-light);color:#fff;}

  /* ===== Settings panel ===== */
  .panel{background:#fff;border:1px solid var(--paper-line);padding:18px 20px;margin-bottom:8px;display:none;}
  .panel.open{display:block;}
  .panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;}
  .panel-grid .field.span2{grid-column:1/-1;}
  .panel-save-row{margin-top:14px;display:flex;align-items:center;gap:12px;}
  .panel-saved-msg{font-size:12px;color:var(--green);opacity:0;transition:opacity .3s;}
  .panel-saved-msg.show{opacity:1;}

  /* ===== Cabin map ===== */
  .cabin-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px;margin-bottom:8px;
  }
  .cabin{
    aspect-ratio:1;border:2px solid;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;font-family:var(--font-mono);user-select:none;transition:transform .15s ease, box-shadow .15s ease;
  }
  .cabin:hover{transform:scale(1.06);box-shadow:var(--shadow-sm);}
  .cabin.free{background:var(--green-bg);border-color:var(--green);color:var(--green);}
  .cabin.occupied{background:var(--red-bg);border-color:var(--red);color:var(--red);}
  .cabin .cnum{font-size:14px;font-weight:bold;}
  .cabin .cname{font-size:8px;text-align:center;padding:0 3px;line-height:1.15;margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cabin-legend{display:flex;gap:18px;font-size:11.5px;color:var(--ink-soft);margin-bottom:14px;align-items:center;}
  .legend-swatch{display:inline-block;width:11px;height:11px;border:2px solid;margin-right:5px;vertical-align:middle;}
  .legend-swatch.free{background:var(--green-bg);border-color:var(--green);}
  .legend-swatch.occupied{background:var(--red-bg);border-color:var(--red);}
  .cabin-badge{
    font-family:var(--font-mono);font-size:11px;border:1px solid #C9C4B0;padding:2px 8px;color:var(--ink-soft);
  }
  .cabin-badge.assigned{border-color:var(--navy);color:var(--navy);font-weight:bold;}

  @media(max-width:640px){
    .form-grid{grid-template-columns:1fr 1fr;}
    .panel-grid{grid-template-columns:1fr;}
    .stats{grid-template-columns:1fr 1fr;}
    .stub{grid-template-columns:56px 1fr;}
    .stub-actions{grid-column:1/-1;align-items:flex-start;padding-top:0;}
    .cabin-grid{grid-template-columns:repeat(auto-fill,minmax(56px,1fr));}
    .history table, .month-table{display:block;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;}
    header .inner{justify-content:center;text-align:center;}
    header .today{text-align:center;}
  }
</style>
</head>

<script>
// ===== Shared data store =====
// Both index.html and admin.html read/write the SAME key in this browser's
// localStorage, so anything entered here (enrolments, payments, cabin
// assignments) shows up immediately in the Admin panel, and vice versa.
// (Open both pages from the same folder/origin for this to work — it does
// not sync across different devices or browsers.)
const STATE_KEY = 'studyHallRegisterState_v1';

const defaultSettings = {
  hallName: 'Study Hall Register',
  ownerName: '',
  ownerPhone: '',
  address: 'Government Exam Preparation Centre',
  defaultFee: 800,
  cabinCount: 20
};
let state = { students: [], nextRoll: 1, settings: {...defaultSettings} };
let loaded = false;

function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
}
function addMonths(dateStr, n){
  const d = new Date(dateStr+'T00:00:00');
  d.setMonth(d.getMonth()+n);
  return d.toISOString().slice(0,10);
}
function daysBetween(a,b){
  const d1 = new Date(a+'T00:00:00'), d2 = new Date(b+'T00:00:00');
  return Math.round((d2-d1)/86400000);
}

document.getElementById('todayDate').textContent = fmtDate(todayStr());
document.getElementById('fJoin').value = todayStr();

async function loadState(){
  try{
    const raw = localStorage.getItem(STATE_KEY);
    if(raw){
      const saved = JSON.parse(raw);
      state = {
        students: saved.students || [],
        nextRoll: saved.nextRoll || 1,
        settings: {...defaultSettings, ...(saved.settings || {})}
      };
      state.students.forEach(s=>{ if(s.cabin === undefined) s.cabin = null; });
    }
  }catch(e){
    console.error('Load failed', e);
  }
  loaded = true;
  document.getElementById('fFee').value = state.settings.defaultFee;
  render();
}

async function saveState(){
  try{
    localStorage.setItem(STATE_KEY, JSON.stringify(state));
  }catch(e){
    console.error('Save failed', e);
  }
}

// Live-sync: if the Admin panel (or another tab) changes the data,
// pick it up here immediately without needing a manual refresh.
window.addEventListener('storage', (e)=>{
  if(e.key === STATE_KEY && loaded){
    loadState();
  }
});

function studentStatus(s){
  const days = daysBetween(todayStr(), s.nextDue); // positive = due in future
  if(days < 0) return {label:'Overdue', cls:'overdue', days};
  if(days <= 5) return {label:'Due Soon', cls:'due', days};
  return {label:'Active', cls:'paid', days};
}

function waLink(s){
  const status = studentStatus(s);
  const msg = `Namaste ${s.name}, this is a reminder from Study Hall that your monthly fee of Rs.${s.fee} was due on ${fmtDate(s.nextDue)}. Kindly pay at your earliest convenience. Thank you!`;
  return `https://wa.me/91${s.phone}?text=${encodeURIComponent(msg)}`;
}

// WhatsApp has no public way for a website to message a specific *group*
// directly (group chats aren't addressable like personal numbers). The
// standard workaround: open WhatsApp's own share/send screen with the text
// pre-filled but no recipient — WhatsApp then lets the admin pick the group
// (or any chat) from their own chat list with one tap.
function groupWaLink(message){
  return `https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`;
}

// e.g. "12/20 filled" — counts students currently assigned a cabin against
// the total cabin/seat count set in Settings.
function cabinOccupancy(){
  const filled = state.students.filter(s=>s.cabin).length;
  const total = state.settings.cabinCount || 0;
  return `${filled}/${total} filled`;
}

function enrollmentGroupMessage(s){
  const hall = state.settings.hallName || 'Study Hall';
  return `🆕 *New Enrollment* — ${hall}\n`
    + `Name: ${s.name}\n`
    + `Cabin: ${s.cabin ? s.cabin : 'Not assigned'}\n`
    + `Fee: ₹${s.fee}/mo\n`
    + `Joined: ${fmtDate(s.joinDate)}\n`
    + `Cabins: ${cabinOccupancy()}`;
}

function paymentGroupMessage(s, payment, paymentIndex){
  const hall = state.settings.hallName || 'Study Hall';
  const type = paymentType(paymentIndex);
  const title = type === 'Renewal' ? 'Renewal Payment Received' : 'First Payment Received';
  return `✅ *${title}* — ${hall}\n`
    + `Name: ${s.name}\n`
    + `Cabin: ${s.cabin ? s.cabin : 'Not assigned'}\n`
    + `Amount: ₹${payment.amount} (${payment.mode === 'upi' ? 'UPI' : 'Cash'})\n`
    + `Payment Type: ${type}\n`
    + `Date: ${fmtDate(payment.date)}\n`
    + `Next Due: ${fmtDate(s.nextDue)}\n`
    + `Cabins: ${cabinOccupancy()}`;
}

function invoiceNumber(s, paymentIndex){
  return `INV-${String(s.rollNo).padStart(3,'0')}-${String(paymentIndex+1).padStart(3,'0')}`;
}

// A student's very first recorded payment is their admission/joining fee;
// every payment after that is a renewal of the monthly subscription.
function paymentType(paymentIndex){
  return paymentIndex === 0 ? 'New Admission' : 'Renewal';
}

function invoiceMessage(s, payment, paymentIndex){
  const hall = state.settings.hallName || 'Study Hall';
  const addr = state.settings.address ? `\n${state.settings.address}` : '';
  const ownerLine = state.settings.ownerPhone ? `\nContact: ${state.settings.ownerPhone}` : '';
  return `*${hall}*${addr}${ownerLine}\n`
    + `——————————————\n`
    + `*PAYMENT RECEIPT*\n`
    + `Invoice: ${invoiceNumber(s, paymentIndex)}\n`
    + `——————————————\n`
    + `Student: ${s.name}\n`
    + `Roll No: ${s.rollNo}${s.cabin ? `\nCabin: ${s.cabin}` : ''}\n`
    + `Amount Paid: Rs.${payment.amount}\n`
    + `Payment Mode: ${payment.mode === 'upi' ? 'UPI' : 'Cash'}\n`
    + `Payment Type: ${paymentType(paymentIndex)}\n`
    + `Payment Date: ${fmtDate(payment.date)}\n`
    + `Next Due Date: ${fmtDate(s.nextDue)}\n`
    + `——————————————\n`
    + `Thank you for your payment!`;
}

function invoiceWaLink(s, payment, paymentIndex){
  return `https://wa.me/91${s.phone}?text=${encodeURIComponent(invoiceMessage(s, payment, paymentIndex))}`;
}

function buildInvoicePDF(s, payment, paymentIndex){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a5'});
  const navy = [27,42,74];
  const ochre = [192,136,41];
  const inkSoft = [92,100,112];
  const pageW = doc.internal.pageSize.getWidth();
  const margin = 40;
  let y = 50;

  // Header band
  doc.setFillColor(...navy);
  doc.rect(0,0,pageW,72,'F');
  doc.setTextColor(255,255,255);
  doc.setFont('times','bold'); doc.setFontSize(18);
  doc.text(state.settings.hallName || 'Study Hall', margin, 32);
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  doc.setTextColor(220,224,232);
  if(state.settings.address) doc.text(state.settings.address, margin, 48);
  if(state.settings.ownerPhone) doc.text('Contact: ' + state.settings.ownerPhone, margin, 60);

  y = 100;
  doc.setTextColor(...navy);
  doc.setFont('times','bold'); doc.setFontSize(15);
  doc.text('PAYMENT RECEIPT', margin, y);
  doc.setDrawColor(...ochre); doc.setLineWidth(1.2);
  doc.line(margin, y+6, pageW-margin, y+6);

  y += 28;
  doc.setFont('helvetica','normal'); doc.setFontSize(10);
  doc.setTextColor(...inkSoft);
  doc.text('Invoice No.', margin, y);
  doc.text('Payment Date', pageW/2, y);
  doc.setFont('helvetica','bold'); doc.setTextColor(...navy);
  doc.text(invoiceNumber(s, paymentIndex), margin, y+14);
  doc.text(fmtDate(payment.date), pageW/2, y+14);

  y += 40;
  doc.setDrawColor(220,216,201); doc.setLineWidth(0.7);
  doc.line(margin, y, pageW-margin, y);
  y += 22;

  const rows = [
    ['Student Name', s.name],
    ['Roll No.', String(s.rollNo)],
    ['Phone', s.phone],
    ['Cabin', s.cabin ? String(s.cabin) : 'Not assigned'],
    ['Amount Paid', 'Rs. ' + payment.amount],
    ['Payment Mode', payment.mode === 'upi' ? 'UPI' : 'Cash'],
    ['Payment Type', paymentType(paymentIndex)],
    ['Next Due Date', fmtDate(s.nextDue)]
  ];
  rows.forEach(([label, val])=>{
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(...inkSoft);
    doc.text(label, margin, y);
    doc.setFont('helvetica','bold'); doc.setTextColor(...navy);
    doc.text(String(val), pageW/2, y);
    y += 20;
  });

  y += 10;
  doc.setDrawColor(...ochre); doc.setLineWidth(1);
  doc.line(margin, y, pageW-margin, y);
  y += 20;
  doc.setFont('times','italic'); doc.setFontSize(10); doc.setTextColor(...inkSoft);
  doc.text('Thank you for your payment.', margin, y);

  // UPI payment QR code — lets the student scan to pay their next due amount.
  const qrSize = 90;
  const qrX = pageW - margin - qrSize;
  const qrY = y + 14;
  doc.addImage(PAYMENT_QR_DATA_URL, 'JPEG', qrX, qrY, qrSize, qrSize);
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...inkSoft);
  doc.text('Scan to pay via UPI', qrX + qrSize/2, qrY + qrSize + 12, {align:'center'});

  return doc;
}

function invoiceFilename(s, paymentIndex){
  return `${invoiceNumber(s, paymentIndex)}_${s.name.replace(/[^a-z0-9]+/gi,'_')}.pdf`;
}

function downloadInvoicePDF(s, payment, paymentIndex){
  const doc = buildInvoicePDF(s, payment, paymentIndex);
  doc.save(invoiceFilename(s, paymentIndex));
}

// Sends the invoice PDF straight to the student, using the device's native
// share sheet (so the admin can pick WhatsApp/SMS/email and it goes with the
// actual file attached to the student's chat) — no download to this device.
// Returns 'shared' | 'cancelled' | 'unsupported'.
async function shareInvoicePDF(s, payment, paymentIndex){
  const doc = buildInvoicePDF(s, payment, paymentIndex);
  const filename = invoiceFilename(s, paymentIndex);

  if(navigator.canShare && navigator.share){
    try{
      const blob = doc.output('blob');
      const file = new File([blob], filename, {type:'application/pdf'});
      if(navigator.canShare({files:[file]})){
        await navigator.share({
          files: [file],
          title: `Invoice — ${s.name}`,
          text: invoiceMessage(s, payment, paymentIndex)
        });
        return 'shared';
      }
    }catch(e){
      if(e && e.name === 'AbortError') return 'cancelled';
      // fall through to the WhatsApp-text fallback below on any other error
    }
  }
  return 'unsupported';
}

function downloadHistoryInvoice(studentId, paymentIndex){
  const s = state.students.find(x=>x.id===studentId);
  if(!s) return;
  const payment = s.payments[paymentIndex];
  if(!payment) return;
  downloadInvoicePDF(s, payment, paymentIndex);
}

async function sendHistoryInvoice(studentId, paymentIndex){
  const s = state.students.find(x=>x.id===studentId);
  if(!s) return;
  const payment = s.payments[paymentIndex];
  if(!payment) return;
  const result = await shareInvoicePDF(s, payment, paymentIndex);
  if(result === 'shared' || result === 'cancelled') return;
  // Device can't share a file directly — send the WhatsApp text reminder,
  // and let the admin download the PDF separately to attach if needed.
  window.open(invoiceWaLink(s, payment, paymentIndex), '_blank');
}

function render(){
  if(!loaded) return;
  renderHeader();
  renderStats();
  renderCabins();
  populateCabinSelect();
  renderReminders();
  renderList();
}

function renderHeader(){
  const s = state.settings;
  document.getElementById('hallNameDisplay').textContent = s.hallName || 'Study Hall Register';
  document.getElementById('hallAddressDisplay').textContent = s.address || 'Government Exam Preparation Centre';
}

function renderCabins(){
  const total = Math.max(0, parseInt(state.settings.cabinCount,10) || 0);
  const grid = document.getElementById('cabinGrid');
  const occupied = {};
  state.students.forEach(s=>{ if(s.cabin) occupied[s.cabin] = s; });
  const freeCount = total - Object.keys(occupied).filter(c=>Number(c)<=total).length;
  document.getElementById('cabinCountLabel').textContent = total ? `(${freeCount} free of ${total})` : '';

  if(total === 0){
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">No cabins set up yet. Add a cabin count in Settings above.</div>';
    return;
  }

  let html = '';
  for(let i=1;i<=total;i++){
    const occ = occupied[i];
    if(occ){
      html += `<div class="cabin occupied" title="Allocated to ${escapeHtml(occ.name)} — click to vacate or reassign" onclick="cabinClicked(${i})">
        <div class="cnum">${i}</div><div class="cname">${escapeHtml(occ.name)}</div>
      </div>`;
    }else{
      html += `<div class="cabin free" title="Free — click to allocate" onclick="cabinClicked(${i})">
        <div class="cnum">${i}</div><div class="cname">Free</div>
      </div>`;
    }
  }
  grid.innerHTML = html;
}

function populateCabinSelect(){
  const total = Math.max(0, parseInt(state.settings.cabinCount,10) || 0);
  const occupied = new Set(state.students.filter(s=>s.cabin).map(s=>s.cabin));
  const sel = document.getElementById('fCabin');
  let html = '<option value="">No cabin</option>';
  for(let i=1;i<=total;i++){
    if(!occupied.has(i)) html += `<option value="${i}">Cabin ${i}</option>`;
  }
  sel.innerHTML = html;
}

function cabinClicked(num){
  const occupant = state.students.find(s=>s.cabin===num);
  if(occupant){
    openModal(`
      <h3>Cabin ${num}</h3>
      <p>Currently allocated to <b>${escapeHtml(occupant.name)}</b> (Roll #${occupant.rollNo}).</p>
      <div class="modal-actions">
        <button class="mini-btn" onclick="closeModal()">Cancel</button>
        <button class="mini-btn danger" onclick="doVacateCabin(${num})">Vacate Cabin</button>
      </div>
    `);
    return;
  }
  if(state.students.length === 0){
    openModal(`
      <h3>No students yet</h3>
      <p>Enrol a student first, then come back and allocate a cabin to them.</p>
      <div class="modal-actions"><button class="mini-btn" onclick="closeModal()">OK</button></div>
    `);
    return;
  }
  const items = state.students.map(s=>{
    const label = s.cabin ? `${escapeHtml(s.name)} (Roll #${s.rollNo}) — currently in Cabin ${s.cabin}` : `${escapeHtml(s.name)} (Roll #${s.rollNo})`;
    return `<li><button onclick="doAssignCabin(${num}, '${s.id}')">${label}</button></li>`;
  }).join('');
  openModal(`
    <h3>Allocate Cabin ${num}</h3>
    <p>Choose a student. If they already have a cabin, it will be reassigned to this one.</p>
    <ul class="modal-list">${items}</ul>
    <div class="modal-actions"><button class="mini-btn" onclick="closeModal()">Cancel</button></div>
  `);
}

async function doVacateCabin(num){
  const occupant = state.students.find(s=>s.cabin===num);
  if(occupant) occupant.cabin = null;
  await saveState();
  closeModal();
  render();
}

async function doAssignCabin(num, studentId){
  const student = state.students.find(s=>s.id===studentId);
  if(!student) return;
  state.students.forEach(s=>{ if(s.cabin===num) s.cabin = null; });
  student.cabin = num;
  await saveState();
  closeModal();
  render();
}

function renderStats(){
  const total = state.students.length;
  const dueList = state.students.filter(s=>studentStatus(s).days<=5);
  const paidCycle = state.students.filter(s=>studentStatus(s).days>5).length;
  let revenue = 0;
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-30);
  state.students.forEach(s=>{
    s.payments.forEach(p=>{
      if(new Date(p.date+'T00:00:00') >= cutoff) revenue += p.amount;
    });
  });
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statPaid').textContent = paidCycle;
  document.getElementById('statDue').textContent = dueList.length;
  document.getElementById('statRevenue').textContent = '₹'+revenue;
}

function renderReminders(){
  const box = document.getElementById('reminders');
  const list = state.students
    .map(s=>({s, st: studentStatus(s)}))
    .filter(x=>x.st.days<=5)
    .sort((a,b)=>a.st.days-b.st.days);
  if(list.length===0){
    box.innerHTML = '<div class="reminder-empty">No one is due within 5 days. All clear.</div>';
    return;
  }
  box.innerHTML = list.map(({s,st})=>{
    const dayTxt = s.payments.length===0
      ? 'First payment pending'
      : (st.days<0 ? `${Math.abs(st.days)} day(s) overdue` : (st.days===0? 'Due today' : `Due in ${st.days} day(s)`));
    return `<div class="reminder-card ${st.cls==='overdue'?'':'amber'}">
      <div class="reminder-info"><b>${escapeHtml(s.name)}</b> — Roll #${s.rollNo} · ₹${s.fee}
        <div class="days">${dayTxt} · ${fmtDate(s.nextDue)}</div>
      </div>
      <a class="wa-btn" href="${waLink(s)}" target="_blank" rel="noopener">Send WhatsApp Reminder</a>
    </div>`;
  }).join('');
}

const LIST_PAGE_SIZE = 5;
let listVisibleCount = LIST_PAGE_SIZE;

function renderList(){
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const listEl = document.getElementById('studentList');
  let students = [...state.students].sort((a,b)=>a.rollNo-b.rollNo);
  if(q){
    students = students.filter(s=>s.name.toLowerCase().includes(q) || s.phone.includes(q));
  }
  document.getElementById('countLabel').textContent = `(${students.length})`;
  if(students.length===0){
    listEl.innerHTML = '<div class="empty-state">No students match. Try a different search, or enrol someone above.</div>';
    return;
  }
  const visibleStudents = students.slice(0, listVisibleCount);
  listEl.innerHTML = visibleStudents.map(s=>{
    const st = studentStatus(s);
    const historyRows = s.payments.slice().reverse().map((p,ri)=>{
      const idx = s.payments.length - 1 - ri;
      const modeTag = p.mode === 'upi' ? 'UPI' : 'Cash';
      const type = paymentType(idx);
      const typeTag = `<span style="font-size:10.5px;text-transform:uppercase;letter-spacing:0.4px;padding:2px 7px;border-radius:10px;${type==='Renewal' ? 'color:var(--navy);background:#E3E8F2;' : 'color:var(--green);background:var(--green-bg);'}">${type}</span>`;
      const proofLink = (p.mode === 'upi' && p.proof)
        ? `<a href="#" onclick="viewProof('${s.id}', ${idx}); return false;" style="color:var(--ochre);">Proof 🖼</a>`
        : (p.mode === 'upi' ? '<span style="color:var(--red);">No proof</span>' : '—');
      return `<tr><td>${fmtDate(p.date)}</td><td>₹${p.amount}</td><td>${modeTag}</td><td>${typeTag}</td><td>${proofLink}</td><td>${invoiceNumber(s, idx)}</td><td><a href="${invoiceWaLink(s, p, idx)}" target="_blank" rel="noopener" style="color:var(--green);">Resend text ↗</a></td><td><a href="#" onclick="sendHistoryInvoice('${s.id}', ${idx}); return false;" style="color:var(--navy);">Send invoice ↗</a></td></tr>`;
    }).join('');
    return `<div class="stub">
      <div class="stub-roll"><span class="lbl">Roll</span><span class="num">${s.rollNo}</span></div>
      <div class="stub-main">
        <div class="name">${escapeHtml(s.name)}</div>
        <div class="stub-meta">
          <span>☎ ${s.phone}</span>
          <span>Joined ${fmtDate(s.joinDate)}</span>
          <span>Fee ₹${s.fee}/mo</span>
          <span>Next due ${fmtDate(s.nextDue)}</span>
        </div>
        <div class="history" style="padding-left:0;border-top:none;">
          <details><summary style="cursor:pointer;color:var(--ink-soft);">Payment history (${s.payments.length})</summary>
            <table>
              <thead><tr style="color:var(--ink-soft);font-size:10.5px;text-transform:uppercase;letter-spacing:0.4px;"><th style="text-align:left;font-weight:normal;padding:4px 6px;">Date</th><th style="text-align:left;font-weight:normal;padding:4px 6px;">Amount</th><th style="text-align:left;font-weight:normal;padding:4px 6px;">Mode</th><th style="text-align:left;font-weight:normal;padding:4px 6px;">Type</th><th style="text-align:left;font-weight:normal;padding:4px 6px;">Proof</th><th style="text-align:left;font-weight:normal;padding:4px 6px;">Invoice</th><th></th><th></th></tr></thead>
              <tbody>${historyRows}</tbody>
            </table>
          </details>
        </div>
      </div>
      <div class="stub-actions">
        <div class="stamp ${st.cls}">${s.payments.length===0 ? 'First Payment Pending' : st.label}</div>
        <div class="cabin-badge ${s.cabin?'assigned':''}">${s.cabin? 'Cabin '+s.cabin : 'No cabin'}</div>
        <div class="btn-row">
          <button class="mini-btn" ${st.cls==='paid' ? 'disabled title="Already paid for this cycle — reopens when the next due date is near"' : ''} onclick="markPaid('${s.id}')">${st.cls==='paid' ? 'Paid ✓' : 'Mark Paid'}</button>
          <a class="mini-btn wa" href="${waLink(s)}" target="_blank" rel="noopener">WhatsApp</a>
          <button class="mini-btn danger" onclick="removeStudent('${s.id}')">Remove</button>
        </div>
      </div>
    </div>`;
  }).join('');

  if(students.length > listVisibleCount){
    const remaining = students.length - listVisibleCount;
    listEl.innerHTML += `<div style="text-align:center;padding:14px 0;">
      <button class="mini-btn" onclick="showMoreStudents()">Show More (${remaining} more)</button>
    </div>`;
  }
}

function showMoreStudents(){
  listVisibleCount += LIST_PAGE_SIZE;
  renderList();
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function openModal(html){
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  document.getElementById('modalBox').innerHTML = '';
  document.getElementById('modalBox').classList.remove('wide');
}
document.getElementById('modalOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'modalOverlay') closeModal();
});

function markPaid(id){
  const s = state.students.find(x=>x.id===id);
  if(!s) return;
  const st = studentStatus(s);
  if(st.cls === 'paid'){
    // Already settled for this cycle — button should be disabled, but guard here too.
    return;
  }
  openPaymentModal(id);
}

// Reads an image file, downsizes it, and returns a compressed base64 JPEG data URL
// so UPI proof screenshots don't bloat storage.
function fileToCompressedDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('read failed'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('image load failed'));
      img.onload = ()=>{
        const maxDim = 900;
        let {width, height} = img;
        if(width > maxDim || height > maxDim){
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width*scale);
          height = Math.round(height*scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0,0,width,height);
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function openPaymentModal(studentId){
  const s = state.students.find(x=>x.id===studentId);
  if(!s) return;
  openModal(`
    <h3>Record Payment</h3>
    <p>${escapeHtml(s.name)} — Roll #${s.rollNo} · Amount ₹${s.fee}</p>
    <div class="field" style="margin-bottom:14px;">
      <label>Payment Date</label>
      <input type="date" id="payDate" value="${todayStr()}">
    </div>
    <div class="field" style="margin-bottom:14px;">
      <label>Payment Mode</label>
      <select id="payMode" onchange="togglePayProofField()">
        <option value="cash">Cash</option>
        <option value="upi">UPI</option>
      </select>
    </div>
    <div class="field" id="payQrField" style="display:none;margin-bottom:14px;text-align:center;">
      <label>Scan to Pay</label>
      <img src="${PAYMENT_QR_DATA_URL}" alt="UPI Payment QR Code" style="width:160px;height:160px;border:1px solid var(--paper-line);border-radius:8px;box-shadow:var(--shadow-sm);">
    </div>
    <div class="field" id="payProofField" style="display:none;margin-bottom:6px;">
      <label>UPI Proof (screenshot required)</label>
      <input type="file" id="payProofFile" accept="image/*">
    </div>
    <div class="form-err" id="payErr"></div>
    <div class="modal-actions">
      <button class="mini-btn" onclick="closeModal()">Cancel</button>
      <button class="add-btn" id="confirmPayBtn" onclick="confirmPayment('${studentId}')">Confirm Payment</button>
    </div>
  `);
}

function togglePayProofField(){
  const mode = document.getElementById('payMode').value;
  document.getElementById('payProofField').style.display = mode === 'upi' ? 'block' : 'none';
  document.getElementById('payQrField').style.display = mode === 'upi' ? 'block' : 'none';
  document.getElementById('payErr').textContent = '';
}

async function confirmPayment(studentId){
  const s = state.students.find(x=>x.id===studentId);
  if(!s) return;
  const mode = document.getElementById('payMode').value;
  const payDate = document.getElementById('payDate').value;
  const errEl = document.getElementById('payErr');
  const btn = document.getElementById('confirmPayBtn');
  let proof = null;

  if(!payDate){
    errEl.textContent = 'Please select the payment date.';
    return;
  }

  if(mode === 'upi'){
    const fileInput = document.getElementById('payProofFile');
    const file = fileInput.files[0];
    if(!file){
      errEl.textContent = 'Please upload a screenshot of the UPI payment as proof.';
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Processing…';
    try{
      proof = await fileToCompressedDataUrl(file);
    }catch(e){
      errEl.textContent = 'Could not read that image. Please try a different file.';
      btn.disabled = false;
      btn.textContent = 'Confirm Payment';
      return;
    }
  }

  const payment = {date: payDate, amount: s.fee, mode, proof};
  s.payments.push(payment);
  s.nextDue = addMonths(s.nextDue, 1);
  await saveState();
  closeModal();
  render();

  const paymentIndex = s.payments.length - 1;
  const result = await shareInvoicePDF(s, payment, paymentIndex);

  if(result === 'shared'){
    openModal(`
      <h3>Payment recorded ✓</h3>
      <p>The invoice has been sent to ${escapeHtml(s.name)}.</p>
      <div class="modal-actions">
        <button class="mini-btn" onclick="closeModal()">Done</button>
        <a class="add-btn" href="${groupWaLink(paymentGroupMessage(s, payment, paymentIndex))}" target="_blank" rel="noopener" onclick="closeModal()">Notify WhatsApp Group</a>
      </div>
    `);
    return;
  }
  if(result === 'cancelled') return; // admin closed the share sheet — nothing more to do

  // This device can't hand the file to another app directly (mostly desktop
  // browsers). Fall back to a WhatsApp text reminder, with the PDF available
  // to download and attach manually.
  const link = invoiceWaLink(s, payment, paymentIndex);
  const win = window.open(link, '_blank');
  openModal(`
    <h3>Payment recorded ✓</h3>
    <p>${win ? 'WhatsApp has been opened with a reminder message for ' + escapeHtml(s.name) + '.' : 'Your browser blocked the automatic WhatsApp popup.'} This device can't attach the PDF automatically — download it below and attach it to the chat.</p>
    <div class="modal-actions">
      <button class="mini-btn" onclick="closeModal()">Close</button>
      ${win ? '' : `<a class="mini-btn wa" href="${link}" target="_blank" rel="noopener">Open WhatsApp</a>`}
      <button class="add-btn" onclick="downloadHistoryInvoice('${s.id}', ${paymentIndex}); closeModal();">Download PDF</button>
      <a class="mini-btn wa" href="${groupWaLink(paymentGroupMessage(s, payment, paymentIndex))}" target="_blank" rel="noopener" onclick="closeModal()">Notify Group</a>
    </div>
  `);
}

function viewProof(studentId, paymentIndex){
  const s = state.students.find(x=>x.id===studentId);
  if(!s) return;
  const payment = s.payments[paymentIndex];
  if(!payment || !payment.proof) return;
  openModal(`
    <h3>UPI Payment Proof</h3>
    <p>${escapeHtml(s.name)} — ${fmtDate(payment.date)} · ₹${payment.amount}</p>
    <img src="${payment.proof}" style="width:100%;border:1px solid var(--paper-line);display:block;margin-bottom:14px;">
    <div class="modal-actions">
      <button class="mini-btn" onclick="closeModal()">Close</button>
    </div>
  `);
}

// Corrects the date on a payment that's already been recorded — e.g. it was
function removeStudent(id){
  const s = state.students.find(x=>x.id===id);
  if(!s) return;
  openModal(`
    <h3>Remove student?</h3>
    <p>Remove <b>${escapeHtml(s.name)}</b> (Roll #${s.rollNo}) from the register? This cannot be undone, including their payment history.</p>
    <div class="modal-actions">
      <button class="mini-btn" onclick="closeModal()">Cancel</button>
      <button class="mini-btn danger" onclick="doRemoveStudent('${id}')">Remove</button>
    </div>
  `);
}

async function doRemoveStudent(id){
  state.students = state.students.filter(x=>x.id!==id);
  await saveState();
  closeModal();
  render();
}

document.getElementById('addBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('fName').value.trim();
  const phone = document.getElementById('fPhone').value.trim();
  const join = document.getElementById('fJoin').value;
  const fee = parseInt(document.getElementById('fFee').value, 10) || state.settings.defaultFee;
  const cabinVal = document.getElementById('fCabin').value;
  const cabin = cabinVal ? parseInt(cabinVal,10) : null;
  const paidNow = document.getElementById('fPaidNow').checked;
  const errEl = document.getElementById('formErr');
  errEl.textContent = '';

  if(!name){ errEl.textContent = 'Please enter the student\'s name.'; return; }
  if(!/^\d{10}$/.test(phone)){ errEl.textContent = 'Please enter a valid 10-digit phone number.'; return; }
  if(!join){ errEl.textContent = 'Please select a joining date.'; return; }

  const student = {
    id: 'stu_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    rollNo: state.nextRoll,
    name, phone, joinDate: join, fee, cabin,
    payments: [],
    nextDue: join
  };
  state.students.push(student);
  state.nextRoll += 1;
  await saveState();

  document.getElementById('fName').value='';
  document.getElementById('fPhone').value='';
  document.getElementById('fJoin').value = todayStr();
  document.getElementById('fFee').value = state.settings.defaultFee;
  document.getElementById('fPaidNow').checked = true;

  // Make sure the student just enrolled shows up right away rather than
  // being tucked behind "Show More".
  if(state.students.length > listVisibleCount){
    listVisibleCount = state.students.length;
  }
  render();

  const notifyMsg = enrollmentGroupMessage(student);
  const nextStep = paidNow ? `openPaymentModal('${student.id}')` : 'closeModal()';
  openModal(`
    <h3>Student Enrolled ✓</h3>
    <p>${escapeHtml(name)} has been added as Roll #${student.rollNo}. Let your WhatsApp admin group know?</p>
    <div class="modal-actions">
      <button class="mini-btn" onclick="${nextStep}">${paidNow ? 'Skip, Continue to Payment' : 'Skip'}</button>
      <a class="add-btn" href="${groupWaLink(notifyMsg)}" target="_blank" rel="noopener" onclick="${nextStep}">Notify WhatsApp Group</a>
    </div>
  `);
});

document.getElementById('searchBox').addEventListener('input', ()=>{
  listVisibleCount = LIST_PAGE_SIZE;
  renderList();
});

loadState();
</script>
</body>
</html>
